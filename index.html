<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            --card-bg: #ffffff;
            --text-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }

        p {
            font-size: 0.95rem;
            margin-bottom: 2rem;
            color: #64748b;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background-color: #64748b;
            margin-top: 1rem;
        }

        .secondary-btn:hover {
            background-color: #475569;
        }

        #qrcode {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 1rem;
            min-height: 128px;
            align-items: center;
        }

        #qrcode img {
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>QR Code Generator</h1>
        <p>Instantly generate QR codes for links or Google searches.</p>

        <div id="text-mode">
            <div class="input-group">
                <label for="text-input">Link or Search Term</label>
                <input type="text" id="text-input" placeholder="e.g., https://rebi.group or 'Pizza in Paris'" autofocus>
            </div>
        </div>

        <button id="generate-btn">Generate QR Code</button>

        <div id="qrcode" class="hidden"></div>
        <button id="download-btn" class="hidden secondary-btn">Download QR Code</button>
        
        <footer style="margin-top: 2rem; border-top: 1px solid #e2e8f0; padding-top: 1.5rem;">
            <p style="font-size: 0.8rem; color: #94a3b8; margin: 0;">Developed by</p>
            <p style="font-weight: 700; color: #475569; margin-top: 0.25rem;">REBI group</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const downloadBtn = document.getElementById('download-btn');
        const qrcodeContainer = document.getElementById('qrcode');

        let qrcodeInstance = null;

        function isURL(str) {
            const pattern = new RegExp('^(https?:\\/\\/)?'+ 
                '((([a-z\\d]([a-z\\d-]*[a-z\\d])*)\\.)+[a-z]{2,}|'+ 
                '((\\d{1,3}\\.){3}\\d{1,3}))'+ 
                '(\\:\\d+)?(\\/[-a-z\\d%_.~+]*)*'+ 
                '(\\?[;&a-z\\d%_.~+=-]*)?'+ 
                '(\\#[-a-z\\d_]*)?$','i');
            return !!pattern.test(str);
        }

        function generateQR() {
            const inputVal = textInput.value.trim();
            if (!inputVal) {
                alert('Please enter a link or search term!');
                return;
            }

            let text = '';
            if (!isURL(inputVal)) {
                text = `https://www.google.com/search?q=${encodeURIComponent(inputVal)}`;
            } else {
                text = inputVal.startsWith('http') ? inputVal : `https://${inputVal}`;
            }

            qrcodeContainer.innerHTML = '';
            qrcodeContainer.classList.remove('hidden');
            downloadBtn.classList.add('hidden');

            qrcodeInstance = new QRCode(qrcodeContainer, {
                text: text,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const qrImg = qrcodeContainer.querySelector('img');
                if (qrImg) {
                    downloadBtn.classList.remove('hidden');
                }
            }, 100);
        }

        function downloadQR() {
            const qrImg = qrcodeContainer.querySelector('img');
            if (!qrImg) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const padding = 40;
            const qrSize = 256;
            
            canvas.width = qrSize + (padding * 2);
            canvas.height = qrSize + (padding * 2);

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            
            const r = 20;
            const w = canvas.width - 20;
            const h = canvas.height - 20;
            const x = 10;
            const y = 10;
            
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            ctx.stroke();

            if (qrImg.complete) {
                ctx.drawImage(qrImg, padding, padding, qrSize, qrSize);
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'qrcode-framed.png';
                link.click();
            } else {
                qrImg.onload = () => {
                    ctx.drawImage(qrImg, padding, padding, qrSize, qrSize);
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = 'qrcode-framed.png';
                    link.click();
                };
            }
        }

        generateBtn.addEventListener('click', generateQR);
        downloadBtn.addEventListener('click', downloadQR);

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateQR();
            }
        });
    </script>
</body>
</html>
